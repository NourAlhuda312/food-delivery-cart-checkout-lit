<!doctype html>
<html lang="en">
  <head>
    <link rel="icon" type="image/png" href="/favicon.png" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yum Cart Checkout MFE Bundle Demo</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0&family=Roboto:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
      body{margin:0;background:#eef2ec;font-family:Roboto,Arial,sans-serif;color:#1f1f1f}
      .demo-tools{position:relative;z-index:5;padding:12px 16px;background:#fff;border-bottom:1px solid #e0e0e0;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
      .demo-tools button{min-height:44px;border:1px solid #2e7d32;background:#fff;border-radius:12px;padding:8px 12px;font-weight:600;cursor:pointer}
    </style>
  </head>
  <body>
    <div class="demo-tools" aria-label="Development-only catalog event controls">
      <strong>Bundle integration demo:</strong>
      <button data-fixture="0">Add Classic Cheeseburger</button>
      <button data-fixture="1">Add Loaded House Fries</button>
      <button data-fixture="2">Add Musakhan Rolls (conflict)</button>
      <button id="route-cart">Show /cart</button>
    </div>
    <yum-cart-checkout></yum-cart-checkout>
    <script type="module" src="/mfe/yum-cart-checkout.js"></script>
    <script type="module">
      const fixtures = [
        {id:'meal-101',restaurantId:'rest-01',restaurantName:'Burger House',name:'Classic Cheeseburger',description:'Beef patty, cheddar, lettuce, tomato, pickles, and house sauce in a toasted bun.',price:35,image:'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=900&q=80',category:'Burgers',quantity:1},
        {id:'meal-104',restaurantId:'rest-01',restaurantName:'Burger House',name:'Loaded House Fries',description:'Crispy fries topped with cheese sauce, caramelized onions, and burger sauce.',price:24,image:'https://images.unsplash.com/photo-1573080496219-bb080dd4f877?auto=format&fit=crop&w=900&q=80',category:'Sides',quantity:1},
        {id:'meal-201',restaurantId:'rest-02',restaurantName:'Olive & Zaatar',name:'Musakhan Rolls',description:'Sumac chicken, caramelized onions, toasted pine nuts, and taboon bread rolls.',price:42,image:'https://images.unsplash.com/photo-1601050690597-df0568f70950?auto=format&fit=crop&w=900&q=80',category:'Main Dishes',quantity:1}
      ];
      const navigate = (route) => { history.pushState({}, '', route); window.dispatchEvent(new PopStateEvent('popstate')); };
      document.querySelectorAll('[data-fixture]').forEach((button) => button.addEventListener('click', () => {
        const item = fixtures[Number(button.dataset.fixture)];
        window.dispatchEvent(new CustomEvent('cart:add-item', { detail: { item }, bubbles: true, composed: true }));
      }));
      document.querySelector('#route-cart').addEventListener('click', () => navigate('/cart'));
      document.addEventListener('navigation:requested', (event) => navigate(event.detail.route));
      if (!['/cart','/checkout/delivery','/checkout/payment','/order-confirmation'].includes(location.pathname)) navigate('/cart');
    </script>
  </body>
</html>
